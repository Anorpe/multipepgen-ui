# Plantilla procesada por el entrypoint de nginx:alpine (envsubst).
# NGINX_ENTRYPOINT_LOCAL_RESOLVERS=1 expone el DNS de la red de contenedores
# en ${NGINX_LOCAL_RESOLVERS}, para resolver los nombres de las APIs en cada
# request y que nginx arranque aunque una API aún no esté levantada.
server {
    listen 80;
    server_name localhost;

    resolver ${NGINX_LOCAL_RESOLVERS} valid=10s ipv6=off;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Proxy for Generation API (contenedor en la misma red interna)
    location /api/generate {
        set $generation_api ${GENERATION_API_UPSTREAM};
        rewrite ^/api/generate(.*)$ /generate/$1 break;
        proxy_pass $generation_api;
        proxy_read_timeout 300s;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy for Prediction API (contenedor en la misma red interna)
    location /api/predict {
        set $prediction_api ${PREDICTION_API_UPSTREAM};
        rewrite ^/api/predict(.*)$ /predict$1 break;
        proxy_pass $prediction_api;
        proxy_read_timeout 300s;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
